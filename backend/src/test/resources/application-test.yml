# Profile for tests that need a database but must run without Postgres: in-memory H2, schema built from the
# entities (the Flyway migrations use Postgres-only SQL), and no background ingestion calling the internet.
spring:
  datasource:
    url: jdbc:h2:mem:healthwatch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop

ingestion:
  scheduling:
    enabled: false
