spring:
  application:
    name: healthwatch-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthwatch}
    username: ${DB_USERNAME:healthwatch}
    password: ${DB_PASSWORD:healthwatch}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  detection:
    region: central # the one Sprint 1 region; must match what ingestion stores
    z-threshold: 3.0
    consecutive-readings: 3
    max-gap: 90m # ~1.5x the feed's update interval; adjust once the S1-4 spike confirms it
  seed:
    admin-username: ${ADMIN_SEED_USERNAME:#{null}}
    admin-password: ${ADMIN_SEED_PASSWORD:#{null}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

ingestion:
  scheduling:
    enabled: ${INGESTION_SCHEDULING_ENABLED:true}
    fixed-delay-ms: ${INGESTION_SCHEDULING_FIXED_DELAY_MS:3600000}
  http:
    connect-timeout: ${INGESTION_HTTP_CONNECT_TIMEOUT:PT5S} # How long to wait while trying to establish a connection to the AQI server before giving up.
    read-timeout: ${INGESTION_HTTP_READ_TIMEOUT:PT10S} # Once connected, how long to wait for the server to actually send back data before giving up.
    max-attempts: ${INGESTION_HTTP_MAX_ATTEMPTS:3} # How many times FetchClient will attempt the whole fetch if it fails, before giving up for this cycle.
    initial-backoff: ${INGESTION_HTTP_INITIAL_BACKOFF:PT2S} # How long to wait before retrying after a failed attempt.

pm:
  source:
    url: ${PM_SOURCE_URL:https://api-open.data.gov.sg/v2/real-time/api/pm25}
    name: ${PM_SOURCE_NAME:datagovsg_pm25}
    type: ${PM_SOURCE_TYPE:air_quality}
    region: ${PM_SOURCE_REGION:central}
